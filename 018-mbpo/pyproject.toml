[project]
name = "018-mbpo"
version = "0.1.0"
requires-python = ">=3.10"
description = "MBPO: Model-Based Policy Optimization with ensemble dynamics and short model rollouts augmenting SAC"
dependencies = [
    "rl-common",
    "gymnasium[mujoco]==1.1.1",
    "torch>=2.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv.sources]
rl-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["ipykernel"]
