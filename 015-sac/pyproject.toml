[project]
name = "015-sac"
version = "0.1.0"
requires-python = ">=3.10"
description = "Soft Actor-Critic (SAC): maximum-entropy RL with automatic temperature tuning"
dependencies = [
    "rl-common",
    "gymnasium[classic-control,mujoco]==1.1.1",
    "torch>=2.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv.sources]
rl-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["ipykernel"]
