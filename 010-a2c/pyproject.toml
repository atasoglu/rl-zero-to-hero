[project]
name = "010-a2c"
version = "0.1.0"
requires-python = ">=3.10"
description = "Advantage Actor-Critic (A2C): combine policy gradient with a learned value baseline"
dependencies = [
    "rl-common",
    "gymnasium[classic-control,box2d,mujoco]==1.1.1",
    "torch>=2.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv.sources]
rl-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["ipykernel"]
