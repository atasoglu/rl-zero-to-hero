[project]
name = "019-world-models"
version = "0.1.0"
requires-python = ">=3.10"
description = "World Models (Ha & Schmidhuber 2018): VAE visual encoder + MDN-RNN memory + PPO controller in latent space"
dependencies = [
    "rl-common",
    "gymnasium[box2d]==1.1.1",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv.sources]
rl-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["ipykernel"]
