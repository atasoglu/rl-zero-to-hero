[project]
name = "006-double-dqn"
version = "0.1.0"
requires-python = ">=3.10"
description = "Double DQN: decouple action selection from action evaluation to remove overestimation bias"
dependencies = [
    "rl-common",
    "gymnasium[classic-control,box2d]==1.1.1",
    "torch>=2.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.uv.sources]
rl-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["ipykernel"]
